<style>
/* Layout: a repair-order ticket. RO header fields, then four action buckets, then item rows grouped by action, then the message to send. */
:root {
  --bg: #f3f5f7;
  --paper: #ffffff;
  --ink: #17202a;
  --muted: #5b6876;
  --line: #d9dfe5;
  --accent: #1f5f8b;
  --accent-soft: #e4eef6;
  --now: #b4232c;   --now-soft: #fbe9ea;
  --ok: #1e7a46;    --ok-soft: #e5f4ea;
  --ask: #a35f00;   --ask-soft: #fdf1df;
  --skip: #5b6876;  --skip-soft: #eceff2;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --paper: #172027; --ink: #e6ebef; --muted: #9aa8b4; --line: #2a3640;
    --accent: #6fb1e0; --accent-soft: #1a2e3d;
    --now: #ff7a80; --now-soft: #3a1c20; --ok: #5fd08f; --ok-soft: #16301f;
    --ask: #f0b35a; --ask-soft: #36290f; --skip: #a7b3bd; --skip-soft: #222c34;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --paper: #172027; --ink: #e6ebef; --muted: #9aa8b4; --line: #2a3640;
  --accent: #6fb1e0; --accent-soft: #1a2e3d;
  --now: #ff7a80; --now-soft: #3a1c20; --ok: #5fd08f; --ok-soft: #16301f;
  --ask: #f0b35a; --ask-soft: #36290f; --skip: #a7b3bd; --skip-soft: #222c34;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 960px; margin: 0 auto; padding-block: 28px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(30px, 5vw, 42px); }
h2 { font-size: 26px; }
h3 { font-size: 20px; font-weight: 600; }
p { margin: 0; }
.label { font-family: var(--mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Mode switch */
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 3px; gap: 3px; justify-self: start; }
.modes button { font: 500 13px var(--body); color: var(--muted); background: none; border: 0; padding: 7px 14px; border-radius: 6px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.modes button:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* RO header */
.ro { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ro-top { padding: 22px 22px 18px; display: grid; gap: 10px; border-bottom: 1px dashed var(--line); }
.ro-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.ro-fields div { padding: 12px 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.ro-fields b { display: block; font: 500 14px var(--mono); margin-top: 2px; overflow-wrap: anywhere; }
.bottom { padding: 18px 22px; display: grid; gap: 8px; }
.bottom p { max-width: 70ch; font-size: 16px; }

/* Buckets */
.buckets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 720px) { .buckets { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bucket { border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; background: var(--c-soft); border: 1px solid transparent; text-decoration: none; color: var(--ink); }
.bucket:hover { border-color: var(--c); }
.bucket .n { font: 700 40px/1 var(--display); color: var(--c); }
.bucket .t { font: 700 18px var(--display); letter-spacing: .02em; }
.bucket .d { font-size: 13px; color: var(--muted); }
.b-now { --c: var(--now); --c-soft: var(--now-soft); }
.b-approve { --c: var(--ok); --c-soft: var(--ok-soft); }
.b-ask { --c: var(--ask); --c-soft: var(--ask-soft); }
.b-skip { --c: var(--skip); --c-soft: var(--skip-soft); }

/* Item groups */
.group { display: grid; gap: 10px; }
.group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 2px solid var(--c); }
.group-head h2 { color: var(--c); }
.items { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr); gap: 6px 28px; padding: 16px 20px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
@media (max-width: 720px) { .item { grid-template-columns: 1fr; } }
.item-name { display: grid; gap: 6px; align-content: start; }
.item-name h3 { font-size: 19px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 11.5px var(--mono); letter-spacing: .03em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.grade::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--g); vertical-align: 0; }
.g-red { --g: var(--now); } .g-yellow { --g: var(--ask); } .g-green { --g: var(--ok); } .g-none { --g: var(--skip); }
.chip.status { background: var(--c-soft); color: var(--c); border-color: transparent; }
.item-body { display: grid; gap: 8px; min-width: 0; }
.row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
@media (max-width: 420px) { .row { grid-template-columns: 1fr; gap: 0; } }
.row .label { padding-top: 3px; }
.ask-line { color: var(--ink); font-weight: 500; }
.parts { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.part { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 8px 12px; border-top: 1px solid var(--line); }
.part:first-child { border-top: 0; }
.part b { font-weight: 600; font-size: 14px; }
.part .v { font: 500 11.5px var(--mono); letter-spacing: .03em; color: var(--muted); align-self: center; text-align: right; }
.part .v.hot { color: var(--now); }
.part p { grid-column: 1 / -1; font-size: 13.5px; color: var(--muted); }

/* Conflicting statements */
.conflicts { display: grid; gap: 12px; }
.conflict { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px 14px; align-items: stretch; }
@media (max-width: 720px) { .conflict { grid-template-columns: 1fr; } .vs { justify-self: start; } }
.quote { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); display: grid; gap: 4px; align-content: start; }
.quote q { font-size: 14.5px; quotes: "\201C" "\201D"; }
.vs { font: 700 15px var(--display); color: var(--now); align-self: center; letter-spacing: .06em; }
.conflict .why { grid-column: 1 / -1; font-size: 14px; color: var(--muted); padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.conflict:last-child .why { border-bottom: 0; padding-bottom: 0; }

/* Panels */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; display: grid; gap: 14px; }
.panel ul, .panel ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.msg { position: relative; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.msg-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.msg pre { margin: 0; padding: 14px; white-space: pre-wrap; font: 14px/1.6 var(--body); overflow-wrap: anywhere; }
.copy { font: 500 13px var(--body); border: 1px solid var(--accent); color: var(--accent); background: var(--paper); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.copy.done { background: var(--accent); color: var(--paper); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 720px) { .two { grid-template-columns: 1fr; } }

/* Owner scorecard */
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.score { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 6px; background: var(--paper); }
.score .v { font: 700 28px/1 var(--display); }
.bar { height: 6px; border-radius: 3px; background: var(--skip-soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c); }
.s-good { --c: var(--ok); } .s-warn { --c: var(--ask); } .s-bad { --c: var(--now); }
.score .v { color: var(--c); }
.foot { font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 80ch; }
@media (prefers-reduced-motion: no-preference) { .copy { transition: background .15s, color .15s; } }
</style>

      "Call the shop that installed the front calipers. Ask whether the parts and labor are under warranty. A leak at a fitting they installed is usually their responsibility.",
      "Find your mileage and Dodge's maintenance schedule (owner's manual or a dealer) before approving any fluid service."
    ],
    "rights": "California: the shop needs your authorization on a written estimate before doing work, and a new authorization before going over it. You can ask for your replaced parts back when you approve the work.",
    "message": {
      "title": "Text or email to the shop",
      "body": "Hi, thanks for the inspection on my Ram (Oct 12). Here's how I'd like to proceed:\n\nPlease go ahead with:\n1. Repair the leak at the right-front brake line fitting, refill and bleed the brakes, and check whether the pedal holds firm.\n2. Replace the right taillight lens.\nPlease send me an updated written estimate for these before starting.\n\nThe front calipers were installed recently at another shop, and I'm checking whether they're under warranty. Could you write down what you found at the leaking fitting (washer, bolt, threads) with photos, and hold off on replacing the calipers for now?\n\nA few questions before I approve anything else:\n- After the leak repair and bleed, does the pedal hold? I'd like to decide on the master cylinder after that.\n- Which warning-light codes came up on the scan?\n- What is the current mileage, and which Dodge interval are the fluid services based on?\n- Did the other three tie rod ends have play, or only the one at the pitman arm?\n\nI'd also like any replaced parts returned to me. Thanks!"
    },
    "phone": [
      "Approve the leak repair, the bleed and the taillight first.",
      "Ask for a written estimate before they start.",
      "Tell them the calipers came from another shop. Ask them to document the leaking fitting with photos and hold off on new calipers.",
      "Ask them to test the pedal after bleeding before replacing the master cylinder.",
      "Ask for the mileage and the warning-light codes.",
      "Defer the fluid services until they show you Dodge's schedule."
    ]
  },
  "owner": {
    "scores": [
      {
        "label": "Customer concerns addressed",
        "value": 2,
        "of": 2,
        "tone": "good",
        "note": "Brakes and taillight both answered directly."
      },
      {
        "label": "Statements that conflict",
        "value": 7,
        "of": 7,
        "tone": "bad",
        "note": "Towed-in vs. test drive; new calipers vs. replace calipers; cause not repaired."
      },
      {
        "label": "Findings with a measurement",
        "value": 1,
        "of": 16,
        "tone": "bad",
        "note": "Only the pad thickness. No tread, battery, or codes."
      },
      {
        "label": "Findings with photo or video",
        "value": 14,
        "of": 16,
        "tone": "good",
        "note": "Strong habit. Arrows used well."
      },
      {
        "label": "Recommendation repairs the stated cause",
        "value": 0,
        "of": 1,
        "tone": "bad",
        "note": "Leak at the fitting identified, but not on the plan."
      },
      {
        "label": "Recommendations wider than the finding",
        "value": 2,
        "of": 16,
        "tone": "warn",
        "note": "Calipers and master cylinder for a fitting leak; four tie rods for one with play."
      }
    ],
    "techNote": {
      "title": "Coaching note to the technician (private)",
      "body": "Good work on the 2001 Ram: you found the leak at the right-front fitting fast, photographed it, and tied it to the empty reservoir and the low pedal. That's the hard part. Marking spark plugs N/A on the diesel was right too.\n\nThree things to tighten up:\n1. Fix the cause you found. The recommendation should start with repairing the leaking fitting and bleeding the system, then retest the pedal. Calipers you've noted as recently replaced, and a master cylinder that ran dry because of the leak, need their own evidence before we quote them.\n2. Keep the report consistent. It says the truck was towed in, and the test drive section says the brakes were hard to stop. If it wasn't driven, mark the test drive N/A. Same with the red Front Brake System grade sitting next to 'pads 7+mm, good'. Say what the red is for.\n3. Put the number on it. Odometer, tread per tire in 32nds, the battery test, and the scan codes.\n\nLet's go over your next inspection together."
    },
    "advisorNote": {
      "title": "Note to the service advisor",
      "body": "Before presenting the Ram estimate: lead with the fitting repair and bleed, and make the master cylinder conditional on the pedal test. Check our records for the recent caliper job. If it wasn't ours, the customer will likely take a warranty claim to the installing shop, so document the fitting (washer, bolt, threads, photos) for them. If it was ours, it's a comeback. Add the odometer, drop the rear diff service if the reseal is approved, and present fluid services as optional with the Dodge interval shown."
    },
    "fixes": [
      "Add a canned finding for brake line or fitting leaks that leads with 'repair the fitting, bleed, retest the pedal'.",
      "Require the odometer before an inspection can be sent.",
      "Default the Test Drive section to N/A when the vehicle arrives on a tow.",
      "Replace the generic '3 years or 30,000 miles' canned findings with Recommended Maintenance tied to the odometer and OEM intervals.",
      "Change the air filter task's default from red to yellow, and split engine and cabin filters into separate tasks."

    "customerMessage": {
      "title": "Message to the customer from the shop",
      "body": "Hi, here's where your Ram stands. The brake problem is a leak at the right-front brake line fitting, which let the fluid run out. With your OK, we'll repair that fitting, refill and bleed the brakes, and re-test the pedal. If the pedal holds, the master cylinder can stay. We'll also replace the cracked taillight lens.\n\nIf your front calipers were installed elsewhere recently, we've documented the leaking fitting with photos so you can check the warranty with that shop. Everything else on the list can wait and is your call. You'll get a written estimate before we start anything."

<div class="wrap" id="app"></div>

<script>
(function () {
  var data = JSON.parse(document.getElementById('audit-data').textContent);
  var app = document.getElementById('app');
  var BUCKETS = [
    { key: 'now', cls: 'b-now', title: 'Fix now', desc: 'Safety. Do not drive until handled.' },
    { key: 'approve', cls: 'b-approve', title: 'Approve', desc: 'Supported by the evidence.' },
    { key: 'ask', cls: 'b-ask', title: 'Ask first', desc: 'Get answers before you pay.' },
    { key: 'skip', cls: 'b-skip', title: 'Skip or defer', desc: 'Optional, overlapping, or not due.' }
  ];
  var bucketOf = {}; BUCKETS.forEach(function (b) { bucketOf[b.key] = b; });

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function field(label, value) { return value ? '<div><span class="label">' + esc(label) + '</span><b>' + esc(value) + '</b></div>' : ''; }
  function msgBox(m, id) {
    if (!m) return '';
    return '<div class="msg"><div class="msg-head"><span class="label">' + esc(m.title) + '</span>' +
      '<button class="copy" type="button" data-copy="' + id + '">Copy</button></div><pre id="' + id + '">' + esc(m.body) + '</pre></div>';
  }

  function header(mode) {
    var m = data.meta || {};
    return '<section class="ro">' +
      '<div class="ro-top"><span class="label">' + (mode === 'owner' ? 'Inspection QA audit' : 'Inspection audit') + (data.sample ? ' · sample' : '') + '</span>' +
      '<h1>' + esc(m.vehicle) + '</h1></div>' +
      '<div class="ro-fields">' + field('Engine', m.engine) + field('Mileage', m.mileage) + field('Inspected', m.date) +
      field('Shop', m.shop) + field('Software', m.platform) + field('Status', m.status) + '</div>' +
      '<div class="bottom"><span class="label">Reason for visit</span><p>' + esc(m.reason) + '</p></div>' +
      '<div class="bottom" style="border-top:1px solid var(--line)"><span class="label">Bottom line</span><p>' + esc(data.bottomLine) + '</p></div>' +
      '</section>';
  }

  function bucketTiles() {
    return '<section class="buckets" aria-label="Summary by action">' + BUCKETS.map(function (b) {
      var n = data.items.filter(function (i) { return i.bucket === b.key; }).length;
      return '<a class="bucket ' + b.cls + '" href="#' + b.key + '"><span class="n mono">' + n + '</span><span class="t">' + b.title + '</span><span class="d">' + b.desc + '</span></a>';
    }).join('') + '</section>';
  }

  function itemRow(i) {
    var b = bucketOf[i.bucket] || bucketOf.ask;
    return '<article class="item ' + b.cls + '">' +
      '<div class="item-name"><h3>' + esc(i.name) + '</h3><div class="chips">' +
      '<span class="chip grade g-' + esc(i.grade || 'none') + '">Shop: ' + esc(i.grade || 'n/a') + '</span>' +
      '<span class="chip status">' + esc(i.status) + '</span>' +
      (i.evidence ? '<span class="chip">Evidence: ' + esc(i.evidence) + '</span>' : '') +
      (i.price ? '<span class="chip mono">' + esc(i.price) + '</span>' : '') +
      '</div></div>' +
      '<div class="item-body">' +
      '<div class="row"><span class="label">Shop says</span><p>' + esc(i.shopSays) + '</p></div>' +
      '<div class="row"><span class="label">Why</span><p>' + esc(i.why) + '</p></div>' +
      (i.parts && i.parts.length ? '<div class="row"><span class="label">By part</span><div class="parts">' + i.parts.map(function (p) {
        var hot = /missing from|contradict/i.test(p.verdict);
        return '<div class="part"><b>' + esc(p.name) + '</b><span class="v' + (hot ? ' hot' : '') + '">' + esc(p.verdict) + '</span>' + (p.note ? '<p>' + esc(p.note) + '</p>' : '') + '</div>';
      }).join('') + '</div></div>' : '') +
      '<div class="row"><span class="label">Next step</span><p class="ask-line">' + esc(i.ask) + '</p></div>' +
      '</div></article>';
  }

  function groups() {
    return BUCKETS.map(function (b) {
      var list = data.items.filter(function (i) { return i.bucket === b.key; });
      if (!list.length) return '';
      return '<section class="group ' + b.cls + '" id="' + b.key + '"><div class="group-head"><h2>' + b.title + '</h2><span class="label">' +
        list.length + (list.length === 1 ? ' item' : ' items') + '</span></div><div class="items">' + list.map(itemRow).join('') + '</div></section>';
    }).join('');
  }

  function conflicts() {
    var c = data.contradictions; if (!c || !c.length) return '';
    return '<section class="panel" id="conflicts"><div class="group-head b-now" style="border-bottom:0;padding-bottom:0"><h2 style="color:var(--now)">The report contradicts itself</h2><span class="label">' + c.length + (c.length === 1 ? ' conflict' : ' conflicts') + '</span></div>' +
      '<p class="muted">These are the report\'s own words, side by side. You can point to them without any technical knowledge.</p><div class="conflicts">' +
      c.map(function (x) {
        return '<div class="conflict"><div class="quote"><span class="label">' + esc(x.aWhere) + '</span><q>' + esc(x.a) + '</q></div><span class="vs">VS</span>' +
          '<div class="quote"><span class="label">' + esc(x.bWhere) + '</span><q>' + esc(x.b) + '</q></div><p class="why">' + esc(x.why) + '</p></div>';
      }).join('') + '</div></section>';
  }

  function docs() {
    if (!data.docFindings || !data.docFindings.length) return '';
    return '<section class="panel"><h2>What the report is missing</h2><ul>' + data.docFindings.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('') + '</ul></section>';
  }

  function consumer() {
    var c = data.consumer; if (!c) return '';
    return '<section class="panel" id="talk"><h2>Talk to your shop</h2>' +
      (c.approveNow && c.approveNow.length ? '<div><span class="label">Approve today</span><ol>' + c.approveNow.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ol></div>' : '') +
      (c.yourSteps && c.yourSteps.length ? '<div><span class="label">Your own to-dos</span><ul>' + c.yourSteps.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>' : '') +
      msgBox(c.message, 'msg-shop') +
      (c.phone && c.phone.length ? '<div><span class="label">If you call instead</span><ul>' + c.phone.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>' : '') +
      (c.rights ? '<p class="muted">' + esc(c.rights) + '</p>' : '') +
      '</section>';
  }

  function owner() {
    var o = data.owner; if (!o) return '';
    var scores = (o.scores || []).map(function (s) {
      var pct = s.of ? Math.round(100 * s.value / s.of) : 0;
      var cls = s.tone === 'good' ? 's-good' : s.tone === 'bad' ? 's-bad' : 's-warn';
      return '<div class="score ' + cls + '"><span class="label">' + esc(s.label) + '</span><span class="v mono">' + s.value + ' / ' + s.of +
        '</span><div class="bar" role="img" aria-label="' + pct + ' percent"><i style="width:' + pct + '%"></i></div><span class="muted" style="font-size:13px">' + esc(s.note) + '</span></div>';
    }).join('');
    return '<section class="panel"><h2>Inspection quality</h2><div class="scores">' + scores + '</div></section>' +
      '<section class="panel"><h2>Act on it</h2><div class="two">' + msgBox(o.techNote, 'msg-tech') + msgBox(o.advisorNote, 'msg-adv') + '</div>' +
      (o.fixes && o.fixes.length ? '<div><span class="label">Fix the setup in ' + esc((data.meta || {}).platform || 'your software') + '</span><ul>' + o.fixes.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div>' : '') +
      msgBox(o.customerMessage, 'msg-cust') + '</section>';
  }

  function footer() {
    var a = (data.assumptions || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
    return '<section class="foot">' + (a ? '<span class="label">Assumptions</span><ul style="margin:0;padding-left:20px">' + a + '</ul>' : '') +
      '<p>This audit reviews documents, not the vehicle. It flags where evidence is missing or inconsistent; it does not prove a part is fine. Anything marked safety should be checked in person. Not legal advice.</p></section>';
  }

  var current = data.mode === 'owner' ? 'owner' : 'consumer';
  function render() {
    var toggle = data.mode === 'both' ? '<div class="modes" role="group" aria-label="Report view">' +
      '<button type="button" data-mode="consumer" aria-pressed="' + (current === 'consumer') + '">Vehicle owner view</button>' +
      '<button type="button" data-mode="owner" aria-pressed="' + (current === 'owner') + '">Shop owner view</button></div>' : '';
    app.innerHTML = toggle + header(current) + bucketTiles() + conflicts() + (current === 'consumer' ? consumer() : owner()) + groups() + docs() + footer();
  }
  app.addEventListener('click', function (e) {
    var m = e.target.closest('[data-mode]');
    if (m) { current = m.getAttribute('data-mode'); render(); try { localStorage.setItem('audit-view', current); } catch (_) {} return; }
    var c = e.target.closest('[data-copy]');
    if (c) {
      var el = document.getElementById(c.getAttribute('data-copy'));
      var done = function () { c.textContent = 'Copied'; c.classList.add('done'); setTimeout(function () { c.textContent = 'Copy'; c.classList.remove('done'); }, 1600); };
      var fallback = function () { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'Selected, press copy'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.textContent).then(done, fallback); else fallback();
    }
  });
  try { var saved = localStorage.getItem('audit-view'); if (data.mode === 'both' && (saved === 'owner' || saved === 'consumer')) current = saved; } catch (_) {}
  render();
})();
</script>

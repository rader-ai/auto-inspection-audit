<rect width="1280" height="360" rx="18" fill="#0B1218"/>
<text class="s" x="64" y="72" font-size="22" font-weight="800" fill="#E9EEF2">Approve today</text>
<g class="ap0"><rect x="64" y="96" width="20" height="20" rx="5" fill="none" stroke="#4FD29A" stroke-width="2"/><path d="M69 106 l4 4 l7 -8" fill="none" stroke="#4FD29A" stroke-width="2.4" stroke-linecap="round"/><text class="s" x="96" y="112" font-size="16" fill="#E9EEF2">Leak repair, refill and bleed, pedal check</text></g>
<g class="ap1"><rect x="64" y="130" width="20" height="20" rx="5" fill="none" stroke="#4FD29A" stroke-width="2"/><path d="M69 140 l4 4 l7 -8" fill="none" stroke="#4FD29A" stroke-width="2.4" stroke-linecap="round"/><text class="s" x="96" y="146" font-size="16" fill="#E9EEF2">Right taillight lens</text></g>
<text class="s" x="64" y="214" font-size="22" font-weight="800" fill="#E9EEF2">Your own to-do</text>
<g class="td"><rect x="64" y="238" width="20" height="20" rx="5" fill="none" stroke="#94A6B5" stroke-width="2"/><text class="s" x="96" y="254" font-size="16" fill="#E9EEF2">Call the shop that installed the calipers</text><text class="s" x="96" y="276" font-size="16" fill="#E9EEF2">about warranty</text></g>
<rect x="640" y="40" width="592" height="306" rx="18" fill="#121C25" stroke="#2D3B47"/><text class="s" x="660" y="68" font-size="14" font-weight="600" fill="#94A6B5">Text to the shop · ready to send</text><line x1="640" y1="82" x2="1232" y2="82" stroke="#2D3B47"/>
<rect x="664" y="100" width="544" height="210" rx="16" fill="#0A141C"/>
<text class="s ml0" x="682" y="130" font-size="15" fill="#F1F5F8" xml:space="preserve">Please go ahead with:</text>
<text class="s ml1" x="682" y="153" font-size="15" fill="#F1F5F8" xml:space="preserve">1. Repair the leak at the right-front brake line</text>
<text class="s ml2" x="682" y="176" font-size="15" fill="#F1F5F8" xml:space="preserve">   fitting, refill and bleed, then check the pedal.</text>
<text class="s ml3" x="682" y="199" font-size="15" fill="#F1F5F8" xml:space="preserve">2. Replace the right taillight lens.</text>
<text class="s ml4" x="682" y="222" font-size="15" fill="#F1F5F8" xml:space="preserve">The calipers were installed at another shop and I’m</text>
<text class="s ml5" x="682" y="245" font-size="15" fill="#F1F5F8" xml:space="preserve">checking the warranty. Please document the fitting</text>
<text class="s ml6" x="682" y="268" font-size="15" fill="#F1F5F8" xml:space="preserve">with photos and hold off on new calipers.</text>
<text class="s ml7" x="682" y="291" font-size="15" fill="#F1F5F8" xml:space="preserve">Which warning-light codes came up on the scan?</text>
</svg>

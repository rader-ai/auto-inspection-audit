@keyframes ml0 { 0%,18.0% { opacity: 0; } 19.5%,95% { opacity: 1; } 100% { opacity: 0; } }
.ml1 { animation: ml1 14s linear infinite both; }
@keyframes ml1 { 0%,23.0% { opacity: 0; } 24.5%,95% { opacity: 1; } 100% { opacity: 0; } }

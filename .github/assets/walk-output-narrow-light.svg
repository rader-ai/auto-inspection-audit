<rect width="640" height="700" rx="18" fill="#EEF1F4"/>
<text class="s" x="40" y="56" font-size="22" font-weight="800" fill="#101A23">Approve today</text>
<g class="ap0"><rect x="40" y="80" width="20" height="20" rx="5" fill="none" stroke="#11815A" stroke-width="2"/><path d="M45 90 l4 4 l7 -8" fill="none" stroke="#11815A" stroke-width="2.4" stroke-linecap="round"/><text class="s" x="72" y="96" font-size="16" fill="#101A23">Leak repair, refill and bleed, pedal check</text></g>
<g class="ap1"><rect x="40" y="114" width="20" height="20" rx="5" fill="none" stroke="#11815A" stroke-width="2"/><path d="M45 124 l4 4 l7 -8" fill="none" stroke="#11815A" stroke-width="2.4" stroke-linecap="round"/><text class="s" x="72" y="130" font-size="16" fill="#101A23">Right taillight lens</text></g>
<text class="s" x="40" y="198" font-size="22" font-weight="800" fill="#101A23">Your own to-do</text>
<g class="td"><rect x="40" y="222" width="20" height="20" rx="5" fill="none" stroke="#566573" stroke-width="2"/><text class="s" x="72" y="238" font-size="16" fill="#101A23">Call the shop that installed the calipers</text><text class="s" x="72" y="260" font-size="16" fill="#101A23">about warranty</text></g>
<rect x="24" y="330" width="592" height="306" rx="18" fill="#FFFFFF" stroke="#C3CCD4"/><text class="s" x="44" y="358" font-size="14" font-weight="600" fill="#566573">Text to the shop · ready to send</text><line x1="24" y1="372" x2="616" y2="372" stroke="#C3CCD4"/>
<rect x="48" y="390" width="544" height="210" rx="16" fill="#0F1C27"/>
<text class="s ml0" x="66" y="420" font-size="15" fill="#F1F5F8" xml:space="preserve">Please go ahead with:</text>
<text class="s ml1" x="66" y="443" font-size="15" fill="#F1F5F8" xml:space="preserve">1. Repair the leak at the right-front brake line</text>
<text class="s ml2" x="66" y="466" font-size="15" fill="#F1F5F8" xml:space="preserve">   fitting, refill and bleed, then check the pedal.</text>
<text class="s ml3" x="66" y="489" font-size="15" fill="#F1F5F8" xml:space="preserve">2. Replace the right taillight lens.</text>
<text class="s ml4" x="66" y="512" font-size="15" fill="#F1F5F8" xml:space="preserve">The calipers were installed at another shop and I’m</text>
<text class="s ml5" x="66" y="535" font-size="15" fill="#F1F5F8" xml:space="preserve">checking the warranty. Please document the fitting</text>
<text class="s ml6" x="66" y="558" font-size="15" fill="#F1F5F8" xml:space="preserve">with photos and hold off on new calipers.</text>
<text class="s ml7" x="66" y="581" font-size="15" fill="#F1F5F8" xml:space="preserve">Which warning-light codes came up on the scan?</text>
</svg>

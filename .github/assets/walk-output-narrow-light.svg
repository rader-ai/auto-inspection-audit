<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-labelledby="t d">
<title id="t">Step 3: what you send</title>
<desc id="d">The output: an approve-today list (leak repair with bleed and pedal check; taillight lens), a to-do to call the shop that installed the calipers about warranty, and a ready-to-send text to the shop.</desc>
<style>

<text class="s cb1" x="508" y="204" font-size="15.5" fill="#101A23">“Replace calipers and master cylinder”</text>
<g class="cw1"><rect x="870" y="184" width="3" height="44" fill="#C8263A"/>
<text class="s" x="886" y="202" font-size="15" font-weight="600" fill="#101A23">The plan never repairs the leak the shop</text>
<text class="s" x="886" y="223" font-size="15" font-weight="600" fill="#101A23">named as the cause.</text>
</g>
<line x1="68" y1="260" x2="1212" y2="260" stroke="#C3CCD4" stroke-dasharray="4 4"/>
<text class="s ca2" x="72" y="296" font-size="15.5" fill="#101A23">“Towed in due to possible loss of brakes”</text>
<line class="cl2" x1="452" y1="291" x2="492" y2="291" stroke="#C8263A" stroke-width="2.5"/>
<text class="s cb2" x="508" y="296" font-size="15.5" fill="#101A23">“Test drive: pedal almost goes to the…</text>

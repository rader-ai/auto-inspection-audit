.cl1 { stroke-dasharray: 40.0; }
.cl1 { animation: cl1 13s cubic-bezier(.2,.7,.2,1) infinite both; }
@keyframes cl1 { 0%,28.0% { stroke-dashoffset: 40.0; } 31.0%,95% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 40.0; } }
.cw1 { animation: cw1 13s linear infinite both; }

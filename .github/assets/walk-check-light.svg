<rect width="1280" height="386" rx="18" fill="#EEF1F4"/>
<rect x="48" y="24" width="1184" height="346" rx="10" fill="#FFFFFF" stroke="#C3CCD4"/><line x1="48" y1="64" x2="1232" y2="64" stroke="#C3CCD4"/><text class="s" x="66" y="50" font-size="14" font-weight="600" fill="#566573">Conflicting statements found</text>
<text class="s ca0" x="72" y="112" font-size="15.5" fill="#101A23">“Front brake calipers recently have been…</text>
<line class="cl0" x1="452" y1="107" x2="492" y2="107" stroke="#C8263A" stroke-width="2.5"/>
<text class="s cb0" x="508" y="112" font-size="15.5" fill="#101A23">“Recommend replacing both front…</text>
<g class="cw0"><rect x="870" y="92" width="3" height="44" fill="#C8263A"/>
<text class="s" x="886" y="110" font-size="15" font-weight="600" fill="#101A23">No reason given for why nearly new</text>
<text class="s" x="886" y="131" font-size="15" font-weight="600" fill="#101A23">calipers failed.</text>
</g>
<line x1="68" y1="168" x2="1212" y2="168" stroke="#C3CCD4" stroke-dasharray="4 4"/>
<text class="s ca1" x="72" y="204" font-size="15.5" fill="#101A23">“Banjo bolt leaking caused the master…</text>

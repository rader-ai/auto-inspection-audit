<title id="t">Step 1: the shop's report</title>
<desc id="d">Excerpt of the real report: Front Brake System graded red, right front banjo bolt leaking, pads 7+ mm good; reason for visit says calipers were recently replaced but recommends replacing both calipers and the master cylinder; a yellow item bundles front diff, rear diff and transfer case service as due by interval.</desc>
<style>
